name: Makefile

# Runs unit and integration tests whenever a pull request is opened against
# main, and again on every subsequent push to that PR (GitHub's default
# pull_request activity types: opened, synchronize, reopened).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make tests

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # testcontainers-go spins up RabbitMQ/MySQL/Elasticsearch containers per
    # test against the Docker daemon that's preinstalled on GitHub-hosted
    # ubuntu runners, so no extra services/setup is needed here.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        run: make integrationtests
